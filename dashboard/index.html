<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TekyeBot AI Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🤖 TekyeBot AI</h1>
        <p>Restaurant Dashboard</p>
    </header>

    <main>

        <section class="stats">

            <div class="card">
                <h2>📦</h2>
                <h3>Pending Orders</h3>
                <p id="pendingOrders">0</p>
            </div>

            <div class="card">
                <h2>✅</h2>
                <h3>Completed Orders</h3>
                <p id="completedOrders">0</p>
            </div>

            <div class="card">
                <h2>💰</h2>
                <h3>Today's Sales</h3>
                <p id="sales">GHS 0</p>
            </div>

        </section>


        <section class="orders">

            <h2>Live Orders</h2>

            <div id="ordersList">

                <p>No orders yet.</p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
